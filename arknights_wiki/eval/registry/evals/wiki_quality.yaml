# 概述融合度评估 — 评估 Wiki 页面概述与剧情事件的融合程度
wiki_quality:
  id: wiki_quality.dev.v0
  description: 评估 Wiki 页面概述是否有机融合了设定集信息与游戏剧情事件
  metrics: [score, accuracy]

# ===== 概念 =====
wiki_quality.overview_fusion.concepts:
  class: evals.elsuite.modelgraded.classify:ModelBasedClassify
  args:
    samples_jsonl: wiki_quality_concepts.jsonl
    eval_type: cot_classify
    modelgraded_spec: wiki_overview_fusion

# ===== 阵营 =====
wiki_quality.overview_fusion.factions:
  class: evals.elsuite.modelgraded.classify:ModelBasedClassify
  args:
    samples_jsonl: wiki_quality_factions.jsonl
    eval_type: cot_classify
    modelgraded_spec: wiki_overview_fusion

# ===== 地点 =====
wiki_quality.overview_fusion.locations:
  class: evals.elsuite.modelgraded.classify:ModelBasedClassify
  args:
    samples_jsonl: wiki_quality_locations.jsonl
    eval_type: cot_classify
    modelgraded_spec: wiki_overview_fusion

# ===== 实体索引可追踪性 =====
traceability:
  id: traceability.dev.v0
  description: 验证实体描述是否能从原文 line_range 片段中找到依据
  metrics: [score, accuracy]

# 6a: Pass 1 实体 → 原文追溯
traceability.pass1.all:
  class: evals.elsuite.modelgraded.classify:ModelBasedClassify
  args:
    samples_jsonl: traceability_p1_sample.jsonl
    eval_type: cot_classify
    modelgraded_spec: entity_traceability

# 6b: Pass 2 角色总结 → 事件可追溯
traceability.pass2.characters:
  class: evals.elsuite.modelgraded.classify:ModelBasedClassify
  args:
    samples_jsonl: traceability_p2_sample.jsonl
    eval_type: cot_classify
    modelgraded_spec: character_traceability

# 6c: Pass 3 Wiki 来源可追溯
traceability.pass3.sources:
  class: evals.elsuite.modelgraded.classify:ModelBasedClassify
  args:
    samples_jsonl: traceability_p3_sample.jsonl
    eval_type: cot_classify
    modelgraded_spec: source_traceability
