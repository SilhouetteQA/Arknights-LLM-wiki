entity_traceability:
  prompt: |-
    你是《明日方舟》剧情专家。请验证以下提取的实体描述是否能从原文片段中找到支撑。

    [BEGIN DATA]
    ************
    [实体类型]: {entity_type}
    ************
    [实体名称]: {entity_name}
    ************
    [提取的描述]: {entity_description}
    ************
    [原文片段 (line_range 对应位置)]: {source_text}
    ************
    [章节]: {chapter}
    ************
    [END DATA]

    判断标准:
    - 实体描述是否准确反映了原文片段中讨论的内容?
    - 描述中的信息是否都能在原文中找到依据?
    - 如果描述包含原文中没有的推测或信息扩大化，应降级。

    请判断:
    (A) 完全匹配 — 描述中的信息均在原文中找到直接或合理的依据
    (B) 部分匹配 — 描述大体正确，但存在少量原文未提及的补充或轻微偏差
    (C) 无法确认 — 原文片段过短或信息不足，无法判断描述是否准确
    (D) 明显错误 — 描述与原文内容矛盾或严重偏离

  choice_strings: ABCD
  choice_scores:
    A: 3.0
    B: 2.0
    C: 1.0
    D: 0.0
  input_outputs: {}
  eval_type: cot_classify
