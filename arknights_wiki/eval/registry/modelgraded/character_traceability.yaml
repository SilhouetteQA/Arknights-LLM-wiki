character_traceability:
  prompt: |-
    你是《明日方舟》剧情专家。请验证以下角色 Wiki 页面的总结描述是否能从该角色参与的事件中找到支撑。

    [BEGIN DATA]
    ************
    [角色名称]: {character_name}
    ************
    [角色总结]: {summary}
    ************
    [参与的事件]: {participated_events_text}
    ************
    [来源章节数]: {participated_events_count}
    ************
    [END DATA]

    判断标准:
    - 角色总结中的每个关键陈述（性格特征、能力、关键行为）是否都能在该角色参与的事件中找到对应依据?
    - 如果总结包含事件中未体现的性格判断或能力描述，应降级为部分匹配。
    - 如果总结与事件中的角色表现明显矛盾，应判为错误。

    请判断:
    (A) 完全匹配 — 总结中的核心信息在事件中均有直接或合理的依据
    (B) 部分匹配 — 总结大体正确，但存在事件中未充分体现的推断或泛化
    (C) 信息不足 — 参与事件过少或事件描述过于简略，无法验证总结
    (D) 明显错误 — 总结与事件中的角色表现存在矛盾

  choice_strings: ABCD
  choice_scores:
    A: 3.0
    B: 2.0
    C: 1.0
    D: 0.0
  input_outputs: {}
  eval_type: cot_classify
