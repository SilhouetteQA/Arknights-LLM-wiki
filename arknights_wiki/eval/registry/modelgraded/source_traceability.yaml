source_traceability:
  prompt: |-
    你是《明日方舟》剧情专家。请验证以下 Wiki 页面的来源引用是否有效可追溯。

    [BEGIN DATA]
    ************
    [页面名称]: {name}
    ************
    [分类]: {category}
    ************
    [概述]: {overview}
    ************
    [来源引用]: {sources_text}
    ************
    [在 Pass 1 中找到的匹配章节]: {source_chapters_found}
    ************
    [END DATA]

    判断标准:
    - 来源引用是否指向了有效的章节/来源?
    - 概述中的信息是否能从引用的来源中找到依据?
    - 如果来源区只有"置信度: confirmed"而没有实际章节引用，应判为信息不足。
    - 如果来源引用了大地巡旅（设定集）而非游戏剧情，仍算有效来源。

    请判断:
    (A) 来源完整 — 来源明确引用了具体章节，且在 Pass 1 中有对应记录
    (B) 来源不完整 — 有来源标记但部分章节引用模糊或无法验证
    (C) 无有效来源 — 来源区存在但缺少具体的章节引用（仅标记置信度）
    (D) 来源错误 — 来源引用的章节与概述内容明显不对应

  choice_strings: ABCD
  choice_scores:
    A: 3.0
    B: 2.0
    C: 1.0
    D: 0.0
  input_outputs: {}
  eval_type: cot_classify
