wiki_overview_fusion:
  prompt: |-
    你是《明日方舟》世界观专家。请评估以下 Wiki 页面的"概述"与"剧情事件"两个部分的融合质量。

    [BEGIN DATA]
    ************
    [页面名称]: {name}
    ************
    [分类]: {category}
    ************
    [概述]: {overview}
    ************
    [剧情事件]: {story_events}
    ************
    [END DATA]

    评估标准：
    - 概述是从设定集（大地巡旅）和游戏剧情中综合生成的。
    - 剧情事件是从实际游戏文本中提取的关键事件，代表了游戏内真正发生的内容。
    - 一个高质量的概述应该有机融合设定集信息和剧情事件，两者互补形成完整画像。

    请判断以下哪种情况最符合该页面：
    (A) 概述有机融合了设定集信息和剧情事件，两者互补形成完整画像
    (B) 概述以设定集为主，剧情事件作为补充例证出现
    (C) 概述纯设定集内容，剧情事件仅罗列在后，未融入概述
    (D) 概述内容与剧情事件存在矛盾
    (E) 概述空洞，无实质信息

  choice_strings: ABCDE
  choice_scores:
    A: 4.0
    B: 3.0
    C: 2.0
    D: 0.0
    E: 1.0
  input_outputs: {}
  eval_type: cot_classify
