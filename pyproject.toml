[project]
name = "arknights-wiki"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]
agent = [
    "fastapi>=0.115",
    "sse-starlette>=2.0",
    "langgraph>=0.2",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "openai>=1.0",
]

[tool.setuptools.packages.find]
include = ["arknights_wiki*"]
