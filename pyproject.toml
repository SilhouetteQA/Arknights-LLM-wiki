[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arknights-wiki"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "build>=1.2"]
agent = [
    "fastapi>=0.115",
    "sse-starlette>=2.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "openai>=1.0",
    "langfuse>=4.0",
    "mcp>=2.0",
]

[tool.setuptools.packages.find]
include = ["arknights_wiki*", "agent_core*"]

# Foundation Contract Payload 非 Python 文件必须随 wheel 发布，
# 由 agent_core.contracts.tooling 与 conformance 通过 importlib.resources 读取。
[tool.setuptools.package-data]
"agent_core.contracts" = [
    "contract.md",
    "payload-descriptor.json",
    "schemas/*.json",
]
